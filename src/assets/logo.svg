<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="100%" height="100%">
  <!-- Shima Delivery Logomark -->
  <defs>
    <style>
      .brand-red { fill: #CC0033; }
    </style>
  </defs>

  <!-- Scaled to 0.72x and centered tightly in 220x280 viewBox -->
  <g transform="translate(110, 140) scale(0.72)">
    <!-- Continuous "S" Path -->
    <path class="brand-red" fill-rule="evenodd" d="
      M 35 -160
      C -35 -160, -75 -125, -75 -75
      C -75 -25, -30 10, 0 35
      C 45 70, 75 95, 75 130
      C 75 165, 45 175, 5 175
      C -45 175, -75 145, -75 145
      L -65 110
      C -65 110, -40 135, 5 135
      C 30 135, 38 120, 38 105
      C 38 75, 5 50, -25 25
      C -65 -10, -90 -45, -90 -85
      C -90 -135, -45 -195, 35 -195
      C 80 -195, 105 -170, 105 -170
      L 85 -135
      C 85 -135, 65 -160, 35 -160
      Z
    " />
    
    <!-- Map Indicator Pin Hole (Top Loop Only) -->
    <circle class="brand-red" cx="20" cy="-90" r="18" />
  </g>
</svg>